<style>

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.cell{min-height:110px;border:1px solid var(--line);border-radius:10px;padding:8px}.cell.empty{opacity:.32}

.chips{display:flex;flex-direction:column;gap:4px}

.chip i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}

const isPin=p=>/apertura/i.test(p.title||'');
const gridOrder=[...feed].sort((a,b)=>{const pa=isPin(a)?1:0,pb=isPin(b)?1:0;if(pa!==pb)return pb-pa;return (b.date+b.time).localeCompare(a.date+a.time)}).map(p=>p.i);

document.getElementById('rail').innerHTML=storyDays.map(d=>{const st=byDate[d].filter(p=>p.format==='story');const p=st[0];const dd=new Date(d+'T12:00');return `<div class="ri" onclick="openStory('${d}')"><div class="ring"><img src="${thumb(p.urls[0])}" loading="lazy"></div><span>${dd.getDate()}/${dd.getMonth()+1}</span></div>`}).join('');

function openPost(i){mode='post';curPost=i;curSlide=0;renderPost();}
function slide(d,e){e&&e.stopPropagation();const p=DATA[curPost];curSlide=Math.max(0,Math.min(p.urls.length-1,curSlide+d));renderPost();}
function goSlide(k,e){e&&e.stopPropagation();curSlide=k;renderPost();}
function navPost(d,e){e&&e.stopPropagation();const pos=gridOrder.indexOf(curPost);const nx=gridOrder[pos+d];if(nx===undefined)return;openPost(nx);}
function muteBtn(){return `<button class="mute" onclick="toggleMute(event)">${soundOn?'♪':'✕♪'}</button>`}
function renderPost(){const p=DATA[curPost],u=p.urls,reel=p.format==='reel';
 const ar=reel?'9/16':'4/5', multi=u.length>1, x=u[curSlide];
 const media=isImg(x)?`<img src="${x}" style="aspect-ratio:${ar}">`
  :`<video src="${x}" poster="${thumb(x)}" autoplay ${soundOn?'':'muted'} loop playsinline style="aspect-ratio:${ar}"></video>`;
 const nav=multi?`${curSlide>0?'<button class="pnav pl" onclick="slide(-1,event)">‹</button>':''}${curSlide<u.length-1?'<button class="pnav pr" onclick="slide(1,event)">›</button>':''}<div class="dots">${u.map((_,k)=>`<i class="${k==curSlide?'on':''}" onclick="goSlide(${k},event)"></i>`).join('')}</div><div class="scount">${curSlide+1}/${u.length}</div>`:'';
 const cap=(p.caption||'').replace(/</g,'&lt;');
 const pos=gridOrder.indexOf(curPost);
 show(`${pos>0?'<button class="onav l" onclick="navPost(-1,event)">‹</button>':''}<div class="post"><div class="ph"><div class="pav"><div>◆</div></div><div class="pu">inventagency <span>· Invent</span></div></div><div class="pmedia">${media}${nav}${muteBtn()}</div><div class="pact"><span>♡</span><span>▢</span><span>➤</span><span class="sp"></span><span>⤓</span></div><div class="plk">${(1200+curPost*137%900).toLocaleString()} Me gusta</div><div class="pcap"><span class="badge" style="background:${p.bc}">${p.brand} · ${reel?'reel':(multi?u.length+' slides':'post')} · ${p.date.slice(5)} ${p.time}</span><br><b>inventagency</b> ${cap}</div></div>${pos<gridOrder.length-1?'<button class="onav r" onclick="navPost(1,event)">›</button>':''}`);}
// ---- story phone: tap zones + chevrons + barras reales + auto-avance + salto de día ----
function openStory(d){mode='story';curDay=d;curStory=byDate[d].filter(p=>p.format==='story');curIdx=0;renderStory();}
let svTok=0;
function renderStory(){svTok++;const my=svTok;
 const old=document.getElementById('sv'); if(old){old.ontimeupdate=null;old.onended=null;old.onpause=null;try{old.pause();}catch(e){}}
 const p=curStory[curIdx];const u=p.urls[0];const dd=new Date(p.date+'T12:00');
 const bars=curStory.map((_,k)=>`<i><b style="width:${k<curIdx?'100%':'0'}"${k==curIdx?' id="sfill"':''}></b></i>`).join('');
 const di=storyDays.indexOf(curDay);
 show(`<div class="phone"><div class="pscr"><div class="sbars">${bars}</div><div class="shead"><div class="a"><div></div></div>inventagency<span style="color:#ddd;font-weight:400;margin-left:4px">${dd.getDate()}/${dd.getMonth()+1}</span></div><video id="sv" src="${u}" poster="${thumb(u)}" autoplay ${soundOn?'':'muted'} playsinline></video><div class="snav"><div onclick="storyNav(-1,event)"></div><div onclick="storyNav(1,event)"></div></div><button class="schev l" onclick="storyNav(-1,event)">‹</button><button class="schev r" onclick="storyNav(1,event)">›</button>${muteBtn()}<div class="sfoot">${p.brand} · ${curIdx+1}/${curStory.length}${di<storyDays.length-1?' · sigue '+storyDays[di+1].slice(8)+'/'+(+storyDays[di+1].slice(5,7)):''}</div></div></div>`);
 const v=document.getElementById('sv');
 if(v){v.ontimeupdate=()=>{if(my!==svTok)return;const b=document.getElementById('sfill');if(b&&v.duration)b.style.width=(v.currentTime/v.duration*100)+'%';
        if(v.duration&&v.currentTime>v.duration-0.12){v.ontimeupdate=null;storyNav(1);}};
      v.onended=()=>{if(my!==svTok)return;storyNav(1);};
      v.onpause=()=>{if(my!==svTok||mode!=='story')return;if(!v.ended&&(!v.duration||v.currentTime<v.duration-0.15))v.play().catch(()=>{});};}}
function storyNav(dir,e){e&&e.stopPropagation();const ni=curIdx+dir;
 if(ni<0){const di=storyDays.indexOf(curDay);
   if(di>0){curDay=storyDays[di-1];curStory=byDate[curDay].filter(p=>p.format==='story');curIdx=curStory.length-1;renderStory();}
   return;}
 if(ni>=curStory.length){const di=storyDays.indexOf(curDay);
   if(di<storyDays.length-1){openStory(storyDays[di+1]);}else{closeOv();}
   return;}
 curIdx=ni;renderStory();}
function toggleMute(e){e&&e.stopPropagation();soundOn=!soundOn;document.querySelectorAll('#ovbody video').forEach(v=>v.muted=!soundOn);document.querySelectorAll('.mute').forEach(b=>b.textContent=soundOn?'♪':'✕♪');}
// ---- day (calendar) ----
function openDay(iso){mode='day';const items=(byDate[iso]||[]).filter(match);const dt=new Date(iso+'T12:00');const nm=dt.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
 const fd=items.filter(p=>p.format!=='story'),st=items.filter(p=>p.format==='story');
 let h=`<div style="max-width:960px;width:94vw;max-height:92vh;overflow-y:auto"><h2 style="font-family:Fraunces,serif;font-weight:400;font-size:30px;margin-bottom:2px;text-transform:capitalize">${nm}</h2><div style="color:var(--muted);font-size:14px;margin-bottom:22px">${fd.length} feed · ${st.length} stories — clic en una pieza para verla</div><div style="display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start">`;
 fd.forEach(p=>{const u=p.urls;const reel=p.format==='reel';const ar=reel?'9/16':'4/5';
  h+=`<div style="text-align:center;cursor:pointer" onclick="openPost(${p.i})"><div style="position:relative;width:230px"><img src="${thumb(u[0])}" style="width:230px;aspect-ratio:${ar};object-fit:cover;border-radius:8px"><span style="position:absolute;top:8px;right:10px;color:#fff;font-size:16px;text-shadow:0 1px 6px rgba(0,0,0,.7)">${reel?'▶':(u.length>1?'▤':'')}</span></div><div style="margin-top:8px"><span class="badge" style="background:${p.bc}">${p.brand}</span><div style="font-size:11px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace">${p.time} · ${reel?'reel':u.length+' slides'}</div></div></div>`;});
 if(st.length){h+=`<div style="text-align:center"><div onclick="openStory('${iso}')" style="cursor:pointer"><div class="ring" style="width:120px;height:120px;margin:0 auto"><img src="${thumb(st[0].urls[0])}"></div></div><div style="margin-top:8px"><span class="badge" style="background:${st[0].bc}">${st[0].brand}</span><div style="font-size:11px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace">${st[0].time} · ${st.length} stories</div></div></div>`;}
 h+='</div></div>';show(h);}
// ---- calendar grid ----
let filter='all';const kindOf=p=>p.format==='reel'?'reel':(p.format==='carousel'?'carreel':'story');const match=p=>filter==='all'||kindOf(p)===filter;
const FILTERS=[['all','Todo'],['reel','Reels'],['carreel','Carreels / posts'],['story','Stories']];
document.getElementById('filters').innerHTML=FILTERS.map(f=>`<button class="fb ${f[0]=='all'?'on':''}" data-f="${f[0]}">${f[1]}</button>`).join('');
document.querySelectorAll('.fb').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.fb').forEach(x=>x.classList.toggle('on',x==b));renderCal()});
function renderCal(){const start=new Date(2026,6,13),end=new Date(2026,7,10);const dows=['L','M','M','J','V','S','D'];let h=dows.map(d=>`<div class="dow">${d}</div>`).join('');let fd=(start.getDay()+6)%7;for(let i=0;i<fd;i++)h+='<div></div>';for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const items=(byDate[iso]||[]).filter(match);if(!items.length){h+=`<div class="cell empty"><div class="dn">${d.getDate()}</div></div>`;continue;}const fe=items.filter(p=>p.format!=='story'),se=items.filter(p=>p.format==='story');let ch='';fe.forEach(p=>ch+=`<div class="chip"><i style="background:${p.bc}"></i>${p.brand} · ${p.format=='reel'?'reel':'post'}</div>`);if(se.length)ch+=`<div class="chip"><i style="background:${se[0].bc}"></i>${se[0].brand} · ${se.length} st</div>`;h+=`<div class="cell has" onclick="openDay('${iso}')"><div class="dn">${d.getDate()}</div><div class="chips">${ch}</div></div>`;}document.getElementById('calgrid').innerHTML=h;}
// ---- strategy ----
(function(){let h=`<div class="tesis">${STRAT.tesis}</div><div class="narr">"${STRAT.narrativa}"</div><div class="fun">`;STRAT.funnel.forEach(f=>h+=`<div class="fcard"><div class="p2">${f[0]}</div><h3>${f[1]}</h3><p>${f[2]}</p><div class="k">↳ ${f[3]}</div></div>`);h+='</div>';STRAT.palancas.forEach((p,i)=>h+=`<div class="palanca"><b>0${i+1}</b><div>${p}</div></div>`);document.getElementById('v-strat').innerHTML=h;})();
// ---- tabs + overlay + teclado ----
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x==t));['perfil','cal','strat'].forEach(v=>document.getElementById('v-'+v).classList.toggle('on',v==t.dataset.t));});
function show(html){document.getElementById('ovbody').innerHTML=html;document.getElementById('ov').classList.add('on');}
function closeOv(){mode=null;document.getElementById('ov').classList.remove('on');document.querySelectorAll('#ovbody video').forEach(v=>v.pause());document.getElementById('ovbody').innerHTML='';}
document.getElementById('ov').onclick=e=>{if(e.target.id=='ov')closeOv()};
document.addEventListener('keydown',e=>{
 if(!document.getElementById('ov').classList.contains('on'))return;
 if(e.key==='Escape'){closeOv();return;}
 if(e.key==='ArrowRight'){if(mode==='story')storyNav(1);else if(mode==='post'){const p=DATA[curPost];(p.urls.length>1&&curSlide<p.urls.length-1)?slide(1):navPost(1);}}
 if(e.key==='ArrowLeft'){if(mode==='story')storyNav(-1);else if(mode==='post'){curSlide>0?slide(-1):navPost(-1);}}
});
renderCal();
</script></body></html>
