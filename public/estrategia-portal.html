<style>

.gc .pin{position:absolute;top:8px;left:10px;font-size:13px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.8))}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;padding:6px 8px}
.cell{min-height:110px;border:1px solid var(--line);border-radius:10px;padding:8px}.cell.empty{opacity:.32}

.dn{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:7px}
.chips{display:flex;flex-direction:column;gap:4px}
.chip{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#c9c4b8;background:#ffffff0a;border-radius:6px;padding:3px 7px;white-space:nowrap;overflow:hidden}
.chip i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}

.ov{position:fixed;inset:0;background:rgba(5,6,5,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;z-index:60}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x==t));['perfil','cal','strat'].forEach(v=>document.getElementById('v-'+v).classList.toggle('on',v==t.dataset.t));});
function show(html){document.getElementById('ovbody').innerHTML=html;document.getElementById('ov').classList.add('on');}
function closeOv(){mode=null;document.getElementById('ov').classList.remove('on');document.querySelectorAll('#ovbody video').forEach(v=>v.pause());document.getElementById('ovbody').innerHTML='';}
document.getElementById('ov').onclick=e=>{if(e.target.id=='ov')closeOv()};
document.addEventListener('keydown',e=>{
 if(!document.getElementById('ov').classList.contains('on'))return;
 if(e.key==='Escape'){closeOv();return;}
 if(e.key==='ArrowRight'){if(mode==='story')storyNav(1);else if(mode==='post'){const p=DATA[curPost];(p.urls.length>1&&curSlide<p.urls.length-1)?slide(1):navPost(1);}}
 if(e.key==='ArrowLeft'){if(mode==='story')storyNav(-1);else if(mode==='post'){curSlide>0?slide(-1):navPost(-1);}}
});
renderCal();
</script></body></html>
